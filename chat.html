<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>AQUASENSE — Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/pages/chat.css">
  <script src="assets/js/global.js" defer></script>
  <script src="assets/js/pages/chat.js" defer></script>
</head>

<body>
  <div class="app " data-od-id="app">
    <div class="statusbar"><span>9:41</span><span class="sb-r"><svg width="17" height="11" viewBox="0 0 17 11"
          fill="currentColor" aria-hidden="true">
          <rect x="0" y="7" width="3" height="4" rx="1" />
          <rect x="4.5" y="5" width="3" height="6" rx="1" />
          <rect x="9" y="2.5" width="3" height="8.5" rx="1" />
          <rect x="13.5" y="0" width="3" height="11" rx="1" />
        </svg><svg width="15" height="11" viewBox="0 0 15 11" fill="none" stroke="currentColor" stroke-width="1.6"
          stroke-linecap="round" aria-hidden="true">
          <path d="M1 4a9 9 0 0 1 13 0" />
          <path d="M3.6 6.6a5.4 5.4 0 0 1 7.8 0" />
          <path d="M7.5 9.4h.01" />
        </svg><svg width="24" height="11" viewBox="0 0 24 11" fill="none" aria-hidden="true">
          <rect x=".7" y=".7" width="19" height="9.6" rx="2.6" stroke="currentColor" stroke-opacity=".45" />
          <rect x="2.4" y="2.4" width="14" height="6.2" rx="1.4" fill="currentColor" />
          <path d="M21.5 4v3a2 2 0 0 0 0-3z" fill="currentColor" fill-opacity=".5" />
        </svg></span></div>
    <header class="appbar" data-od-id="appbar"><span class="chat-avatar">SP</span>
      <h1 class="chat-title">Suporte AQUASENSE</h1>
    </header>
    <div class="chat-quick" aria-label="Perguntas rápidas">
      <button type="button" data-msg="Tenho uma dúvida sobre os planos">Dúvida sobre planos</button>
      <button type="button" data-msg="Meu sensor ESP32 está indisponível">Sensor indisponível</button>
      <button type="button" data-msg="Recebi um alerta de vazamento e quero entender melhor">Sobre um alerta</button>
      <button type="button" data-msg="Como faço para cancelar minha assinatura?">Cancelar assinatura</button>
    </div>
    <div class="scroll chat-scroll" data-od-id="chat" id="chatScroll">
      <div class="chat-day">Hoje</div>
      <div class="bubble-row in">
        <div class="bubble">Olá! Sou da equipe de suporte do AQUASENSE 👋 Como posso te ajudar hoje?</div>
        <span class="bubble-time" id="horaInicial">--:--</span>
      </div>
    </div>
    <div class="chat-input-bar">
      <input type="text" id="chatInput" placeholder="Digite sua mensagem…" aria-label="Mensagem">
      <button class="chat-send" id="chatSend" type="button" aria-label="Enviar mensagem" disabled><svg width="19"
          height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true">
          <path d="M4 12h15" />
          <path d="M13 6l6 6-6 6" />
        </svg></button>
    </div>
    <nav class="tabbar" data-od-id="tabbar" aria-label="Navegação principal"><a href="inicio.html"
        data-od-id="tab-home"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 10.5 12 3l9 7.5" />
          <path d="M5 9.5V21h14V9.5" />
        </svg><span>Início</span></a><a href="consumo.html" data-od-id="tab-chart"><svg width="21" height="21"
          viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true">
          <path d="M3 20h18" />
          <path d="M6.5 20v-6" />
          <path d="M11.5 20V7" />
          <path d="M16.5 20v-4" />
          <path d="M21 20V11" />
        </svg><span>Consumo</span></a>
        <!-- <a href="alertas.html" data-od-id="tab-bell"><svg width="21" height="21"
          viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true">
          <path d="M18 8a6 6 0 1 0-12 0c0 6-3 8-3 8h18s-3-2-3-8" />
          <path d="M10.3 21a2 2 0 0 0 3.4 0" />
        </svg><span>Alertas</span></a> -->
        <a href="sensores.html" data-od-id="tab-sensor"><svg width="21" height="21"
          viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="2" />
          <path d="M8.5 15.5a5 5 0 0 1 0-7" />
          <path d="M15.5 8.5a5 5 0 0 1 0 7" />
          <path d="M5.5 18.5a9 9 0 0 1 0-13" />
          <path d="M18.5 5.5a9 9 0 0 1 0 13" />
        </svg><span>Sensores</span></a><a href="planos.html" data-od-id="tab-plans"><svg width="21" height="21"
          viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="5" width="20" height="14" rx="2.5" />
          <path d="M2 10h20" />
        </svg><span>Planos</span></a>
          <!--<a href="perfil.html" data-od-id="tab-user"><svg width="21" height="21"
          viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="8" r="4" />
            <path d="M4 21a8 8 0 0 1 16 0" />
           </svg><span>Perfil</span></a>--></nav>
  </div>
</body>

</html>
